<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Abrindo o GPEX E/4…</title>
    <style>
      :root {
        --oliva-900: #2c3420;
        --oliva-800: #3f4a2b;
        --oliva-100: #e4e8d2;
        --oliva-200: #c9d1b0;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbfcf5;
        color: #22271a;
        font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
        text-align: center;
      }
      main {
        padding: 24px;
        max-width: 34rem;
      }
      .selo {
        display: inline-grid;
        place-items: center;
        min-width: 52px;
        height: 52px;
        padding: 0 8px;
        margin-bottom: 14px;
        border-radius: 8px;
        background: var(--oliva-900);
        border: 2px solid var(--oliva-200);
        color: var(--oliva-100);
        font-weight: 700;
      }
      h1 {
        font-size: 1.05rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin: 0 0 6px;
      }
      p {
        color: #5b6444;
        font-size: 0.88rem;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 10px;
        padding: 9px 16px;
        border-radius: 6px;
        background: var(--oliva-900);
        color: #eef2df;
        font-size: 0.86rem;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="selo">E/4</span>
      <h1>Mapeamento de processos — GPEX</h1>
      <p>
        Endereço não encontrado. Redirecionando para a listagem de processos…
      </p>
      <a href="/logistica-gpex/">Ir para a listagem</a>
    </main>
    <script>
      // O GitHub Pages não tem rewrite de rotas. Este 404.html recebe qualquer
      // caminho profundo (/logistica-gpex/processo/3) e devolve o app para a raiz,
      // preservando o caminho em sessionStorage para o main.jsx reaplicar a rota.
      (function () {
        var base = '/logistica-gpex/'
        var atual = window.location.pathname
        if (atual && atual.indexOf(base) === 0) {
          var interno = atual.slice(base.length)
          if (interno && interno !== '404.html') {
            try {
              sessionStorage.setItem('gpex:redirect', '/' + interno)
            } catch (e) {
              /* modo privado: seguimos sem preservar */
            }
            window.location.replace(base)
            return
          }
        }
        setTimeout(function () {
          window.location.replace(base)
        }, 1200)
      })()
    </script>
  </body>
</html>
